<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLOT KOYAN V2 - MET93</title>
<style>
body{background:#0f0f0f;color:white;text-align:center;font-family:sans-serif;padding:15px}
h1{color:gold;margin:5px}
.box{background:#222;padding:20px;border-radius:20px;max-width:380px;margin:auto;border:2px solid gold}
.slot{font-size:50px;background:white;border-radius:15px;padding:15px;margin:10px 0}
button{background:gold;border:none;padding:13px 25px;font-size:18px;font-weight:bold;border-radius:50px;margin:5px}
.btn-green{background:#00ff88}.btn-red{background:#ff4444;color:white}.btn-blue{background:#00ccff}
#koin{font-size:22px;color:#00ff88;font-weight:bold}
#level{color:gold;font-weight:bold}
.bar{background:#333;height:12px;border-radius:10px;overflow:hidden;margin:8px 0}
#xpbar{background:gold;height:100%;width:0%}
.stat{display:flex;justify-content:space-between;font-size:14px;color:#aaa}
</style>
</head>
<body>
<h1>🎰 SLOT KOYAN V2 🎰</h1>
<p id="koin">💰 Koin: 1000</p>
<p id="level">⭐ LEVEL 1 - PEMULA</p>
<div class="box">
<div class="stat"><span>XP</span><span id="xptxt">0 / 100</span></div>
<div class="bar"><div id="xpbar"></div></div>
<div class="slot" id="slot">🍒 | 🍒 | 🍒</div>
<p id="hasil">Pencet SPIN met!</p>
<button onclick="spin()">SPIN! (-100)</button><br>
<button onclick="toggleAuto()" id="autoBtn" class="btn-blue">▶️ AUTO SPIN: OFF</button><br>
<button onclick="tambah()" class="btn-green" style="font-size:14px">+ 500 KOIN GRATIS</button>
<button onclick="reset()" class="btn-red" style="font-size:14px">RESET</button>
<p style="font-size:13px;color:#aaa">🏆 JACKPOT 3 Sama = +5000<br>✨ 2 Sama = +300<br>⭐ Naik Level = Bonus Koin!<br>Level 5 = JACKPOT x2!</p>
</div>
<p>By MET93 - No Judi, Cuma Seru-seruan!</p>
<script>
let koin=1000, xp=0, level=1, auto=false, autoId=null;
let gambar=["🍒","🍋","🍇","⭐","💎","7️⃣","🔔"];
let titles=["PEMULA","HOKI","SULTAN KECIL","RAJA SLOT","DEWA KOYAN","LEGENDA","MITOS"];
function update(){
document.getElementById("koin").innerText="💰 Koin: "+koin;
document.getElementById("level").innerText="⭐ LEVEL "+level+" - "+(titles[level-1]||"DEWA ABADI");
let need=level*100;
document.getElementById("xptxt").innerText=xp+" / "+need;
document.getElementById("xpbar").style.width=Math.min(100,xp/need*100)+"%";
}
function spin(){
if(koin<100){document.getElementById("hasil").innerText="Koin habis! Pencet tombol hijau!";stopAuto();return;}
koin-=100; xp+=20;
let a=gambar[Math.floor(Math.random()*gambar.length)];
let b=gambar[Math.floor(Math.random()*gambar.length)];
let c=gambar[Math.floor(Math.random()*gambar.length)];
document.getElementById("slot").innerText=a+" | "+b+" | "+c;
let menang=0;
if(a==b && b==c){let mult=level>=5?2:1;menang=5000*mult;document.getElementById("hasil").innerText="🎉 JACKPOT!! +"+menang+" 🔥🔥";}
else if(a==b||b==c||a==c){menang=300;document.getElementById("hasil").innerText="Menang! +300 😎";}
else{document.getElementById("hasil").innerText="Belum hoki, gas lagi!";}
koin+=menang;
let need=level*100;
if(xp>=need){xp-=need;level++;koin+=1000*level;document.getElementById("hasil").innerText+=" | NAIK LEVEL "+level+"! Bonus +"+(1000*level)+"!";}
update();
}
function toggleAuto(){auto=!auto;document.getElementById("autoBtn").innerText=auto?"⏸️ AUTO SPIN: ON":"▶️ AUTO SPIN: OFF";if(auto){autoId=setInterval(spin,700);}else{clearInterval(autoId);}}
function stopAuto(){if(auto){auto=false;clearInterval(autoId);document.getElementById("autoBtn").innerText="▶️ AUTO SPIN: OFF";}}
function tambah(){koin+=500;update();document.getElementById("hasil").innerText="Dapet 500 Koin Gratis!";}
function reset(){koin=1000;xp=0;level=1;stopAuto();update();document.getElementById("hasil").innerText="Di-reset!";}
update();
</script>
</body>
</html>
